# Alembic configuration for the Legal Case Management Platform backend.
# Run from apps/api, e.g. `alembic upgrade head` or `alembic revision -m "..."`.

[alembic]
# Path to migration scripts (relative to this file).
script_location = db/migrations

# Ensure the apps/api directory is importable so env.py can load app modules.
prepend_sys_path = .

# Template used for new migration filenames (timestamped for ordering).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use OS-native path separators.
path_separator = os

# The database URL is resolved at runtime from application settings in env.py,
# so it is intentionally left blank here (no secrets in version control).
sqlalchemy.url =

[post_write_hooks]
# Format newly generated migrations with ruff.
# `exec` (not `console_scripts`): the ruff wheel ships a prebuilt binary and
# declares no console_scripts entry point, so alembic cannot resolve it that
# way. The path is relative to this file so the hook works without activating
# the virtualenv.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/../../.venv/Scripts/ruff.exe
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
