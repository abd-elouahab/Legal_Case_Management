version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: legal-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: legal_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    # Published on 5433, not 5432, and deliberately: PostgreSQL's default port is
    # the one a native install on the developer's machine already holds, and the
    # failure mode when both exist is silent and confusing — the native server
    # takes the IPv4 wildcard, Docker is left with IPv6 only, and every connection
    # to `localhost:5432` reaches the wrong database and fails password
    # authentication with credentials that are correct for the container.
    # The container still listens on 5432 internally, so `POSTGRES_HOST=postgres`
    # inside the compose network is unaffected; only the host-side port moves.
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legal-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: legal-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    # The qdrant/qdrant image ships no curl/wget; use bash's /dev/tcp to probe
    # the REST health endpoint (sh here is dash and lacks /dev/tcp).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The FastAPI backend.
  #
  # **Behind a profile, deliberately.** `docker compose up -d` has meant "bring
  # up the four backing services, then run uvicorn from apps/api" throughout this
  # project, and that is the loop a developer wants — a code change should not
  # need an image rebuild. Adding this service unconditionally would silently
  # turn that command into a multi-gigabyte build. So:
  #
  #     docker compose up -d                          # infrastructure only
  #     docker compose --profile api up -d --build    # infrastructure + API
  #
  # Migrations are **not** run by the container (see the Dockerfile's CMD note).
  # After the first start:
  #
  #     docker compose --profile api exec api python -m alembic upgrade head
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: legal-api
    restart: unless-stopped

    # Reads the same `.env` the local uvicorn process does, then overrides the
    # four host names — inside the compose network the services are reachable by
    # service name, while `.env` names `localhost` for the local workflow.
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      QDRANT_HOST: qdrant
      # The API is addressed through the published port from the host, so the
      # browser's origin is still localhost:3000.
      CORS_ORIGINS: http://localhost:3000

    ports:
      - "8000:8000"

    volumes:
      # The bge-m3 download (~2.3 GB), kept across container replacements. It is
      # fetched lazily on the first indexing run, so a fresh volume means the
      # first index is slow rather than broken.
      - model_cache:/models

    # `service_healthy` rather than `service_started`: the API probes all four on
    # startup and logs a warning rather than failing, but starting it before
    # PostgreSQL accepts connections just means the first requests fail for a
    # reason nobody needs to debug.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  model_cache:
