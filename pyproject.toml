# Python tooling configuration for the Legal Case Management Platform backend.
# The backend package lives in apps/api; tests live in tests/.

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["apps/api", "tests"]
# Paths are resolved from this file's directory, so migration versions must be
# named from the repo root (a bare "db/migrations/versions" never matched).
extend-exclude = [".venv", "apps/web", "apps/api/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
  "core",
  "db",
  "api",
  "schemas",
  "models",
  "repositories",
  "services",
  "scripts",
  "tests",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["\\.venv", "apps/web", "db/migrations"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs.
module = ["minio.*", "qdrant_client.*", "pytesseract.*", "pdf2image.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LiteLLM is an *optional* provider backend (see services/llm.py): it is not in
# requirements.txt, it is imported lazily, and its absence is reported as
# `llm_available: false` rather than being fatal. So it is legitimately absent
# from a normal checkout, and mypy must not fail the build over it.
module = ["litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ReportLab ships no type stubs and no PEP 561 marker. It is a *declared*
# dependency (see requirements.txt) and the only module that imports it is
# `services/report_export.py`, behind the `ReportRenderer` protocol.
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Arabic shaping and bidirectional reordering for PDF export. Both are
# *optional* (see services/report_export.py): they matter only for Arabic PDFs,
# they are not in requirements.txt, they are imported lazily, and their absence
# is logged rather than being fatal. So they are legitimately absent from a
# normal checkout, and mypy must not fail the build over them — the same
# reasoning as `litellm` above.
module = ["arabic_reshaper.*", "bidi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
